<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murmuration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400&display=swap">
<style>
  /* Layout: the sky is the page; a quiet caption top-left, a folded field notebook bottom-right. */
  :root {
    --sky-hi: #2a2c5a;
    --sky-mid: #b0607a;
    --sky-low: #f1a873;
    --ink: #fff4ea;
    --muted: #f3d9c7b0;
    --panel: #1b1a33cc;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--sky-hi); color: var(--ink); overflow: hidden; font: 12px/1.5 var(--mono); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: none; touch-action: none; }
  .cap {
    position: fixed; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px));
    pointer-events: none; max-width: min(36ch, calc(100% - 32px));
  }
  .cap h1 { font: italic 400 clamp(30px, 5vw, 48px)/1 var(--serif); margin: 0 0 6px; letter-spacing: -0.01em; }
  .cap p { margin: 0; color: var(--muted); }
  .cap a { pointer-events: auto; color: var(--muted); text-decoration: none; display: inline-block; margin-bottom: 10px; }
  .cap a:hover { color: var(--ink); }
  details {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 6px; padding: 10px 14px; width: min(260px, calc(100% - 32px));
  }
  summary { cursor: pointer; color: var(--muted); list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+ "; }
  details[open] summary::before { content: "\2013 "; }
  .row { display: grid; grid-template-columns: 9ch 1fr 4ch; gap: 8px; align-items: center; margin-top: 8px; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--sky-low); }
  :focus-visible { outline: 2px solid var(--sky-low); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c" aria-label="A flock of starlings at dusk. Move the pointer to become the hawk; the flock will scatter from you."></canvas>
<div class="cap">
  <a href="index.html">&larr; playpen</a>
  <h1>Murmuration</h1>
  <p id="hint">You are the hawk. Move through them.</p>
</div>
<details>
  <summary>field notes</summary>
  <div class="row"><label for="coh">cohesion</label><input id="coh" type="range" min="0" max="100" value="45"><output for="coh"></output></div>
  <div class="row"><label for="ali">alignment</label><input id="ali" type="range" min="0" max="100" value="62"><output for="ali"></output></div>
  <div class="row"><label for="sep">separation</label><input id="sep" type="range" min="0" max="100" value="55"><output for="sep"></output></div>
  <div class="row"><label for="fear">fear</label><input id="fear" type="range" min="0" max="100" value="70"><output for="fear"></output></div>
  <div class="row"><label for="num">starlings</label><input id="num" type="range" min="100" max="2400" step="100" value="1200"><output for="num"></output></div>
</details>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(2, devicePixelRatio || 1);
  let W = 0, H = 0, sky = null, ridge = null;

  const params = {};
  for (const id of ["coh", "ali", "sep", "fear", "num"]) {
    const el = document.getElementById(id), out = el.nextElementSibling;
    const sync = () => { params[id] = +el.value; out.textContent = el.value; };
    el.addEventListener("input", () => { sync(); if (id === "num") resizeFlock(); });
    sync();
  }
  if (innerWidth < 600) { document.getElementById("num").value = 700; params.num = 700; document.getElementById("num").nextElementSibling.textContent = 700; }

  // ----- flock state in flat typed arrays -----
  const MAX = 2400;
  const px = new Float32Array(MAX), py = new Float32Array(MAX);
  const vx = new Float32Array(MAX), vy = new Float32Array(MAX);
  const depth = new Float32Array(MAX), flap = new Float32Array(MAX);
  let n = 0;

  function spawn(i) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * Math.min(W, H) * 0.18;
    px[i] = W * 0.5 + Math.cos(a) * r; py[i] = H * 0.42 + Math.sin(a) * r * 0.6;
    const h = Math.random() * Math.PI * 2;
    vx[i] = Math.cos(h) * 2; vy[i] = Math.sin(h) * 2;
    depth[i] = 0.55 + Math.random() * 0.6; flap[i] = Math.random() * 10;
  }
  function resizeFlock() {
    const target = params.num;
    while (n < target) spawn(n++);
    n = target;
  }

  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // pre-render sky and treeline once per size
    sky = document.createElement("canvas"); sky.width = W * dpr; sky.height = H * dpr;
    const s = sky.getContext("2d"); s.scale(dpr, dpr);
    const g = s.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#23264f"); g.addColorStop(0.45, "#6d4a78"); g.addColorStop(0.72, "#c4687a"); g.addColorStop(0.9, "#f1a873"); g.addColorStop(1, "#f8c98f");
    s.fillStyle = g; s.fillRect(0, 0, W, H);
    // low sun
    const sun = s.createRadialGradient(W * 0.72, H * 0.9, 0, W * 0.72, H * 0.9, H * 0.35);
    sun.addColorStop(0, "#fff0c8cc"); sun.addColorStop(0.2, "#ffd29a55"); sun.addColorStop(1, "#ffd29a00");
    s.fillStyle = sun; s.fillRect(0, 0, W, H);
    // a few early stars
    s.fillStyle = "#fff8ee";
    for (let i = 0; i < 70; i++) { s.globalAlpha = Math.random() * 0.6; s.fillRect(Math.random() * W, Math.random() * H * 0.35, 1, 1); }
    s.globalAlpha = 1;
    // reedbed / treeline silhouette
    ridge = document.createElement("canvas"); ridge.width = W * dpr; ridge.height = H * dpr;
    const r = ridge.getContext("2d"); r.scale(dpr, dpr);
    r.fillStyle = "#1a1428";
    r.beginPath(); r.moveTo(0, H);
    let y = H * 0.9;
    for (let x = 0; x <= W; x += 6) {
      y += (Math.random() - 0.5) * 3; y = Math.min(H * 0.93, Math.max(H * 0.86, y));
      const tree = Math.random() < 0.035 ? Math.random() * 40 + 10 : 0;
      r.lineTo(x, y - tree);
    }
    r.lineTo(W, H); r.closePath(); r.fill();
    // reeds
    r.strokeStyle = "#1a1428"; r.lineWidth = 1.2;
    for (let x = 0; x < W; x += 3) {
      const h = 10 + Math.random() * 26;
      r.beginPath(); r.moveTo(x, H * 0.95); r.quadraticCurveTo(x + 2, H * 0.95 - h * 0.6, x + (Math.random() - 0.3) * 6, H * 0.95 - h); r.stroke();
    }
    r.fillRect(0, H * 0.95, W, H * 0.05);
    if (n === 0) resizeFlock();
  }
  addEventListener("resize", resize);
  resize();

  // ----- the hawk -----
  const hawk = { x: -999, y: -999, vx: 0, vy: 0, active: false, idle: 0, auto: true, t: 0 };
  function pointer(e) {
    hawk.x = e.clientX; hawk.y = e.clientY; hawk.auto = false; hawk.idle = 0; hawk.active = true;
    document.getElementById("hint").textContent = "The flock tightens and folds around you.";
  }
  canvas.addEventListener("pointermove", pointer);
  canvas.addEventListener("pointerdown", pointer);
  canvas.addEventListener("pointerleave", () => { hawk.auto = true; });

  // ----- spatial hash -----
  const CELL = 40;
  let cols = 0, rows = 0, head = new Int32Array(1), next = new Int32Array(MAX);
  function buildHash() {
    cols = Math.ceil(W / CELL) + 2; rows = Math.ceil(H / CELL) + 2;
    if (head.length < cols * rows) head = new Int32Array(cols * rows);
    head.fill(-1, 0, cols * rows);
    for (let i = 0; i < n; i++) {
      const cx = Math.min(cols - 1, Math.max(0, ((px[i] / CELL) | 0) + 1));
      const cy = Math.min(rows - 1, Math.max(0, ((py[i] / CELL) | 0) + 1));
      const c = cy * cols + cx;
      next[i] = head[c]; head[c] = i;
    }
  }

  let clock = 0;
  function update(dt) {
    const coh = params.coh / 100 * 0.006, ali = params.ali / 100 * 0.09, sep = params.sep / 100 * 1.4;
    const fear = params.fear / 100;
    const R = 34, R2 = R * R, SEP2 = 12 * 12;
    const MAXV = 4.2, MINV = 2.2;

    // autonomous hawk: a slow figure-eight through the sky when no one is driving
    hawk.idle += dt;
    if (hawk.auto && hawk.idle > 120) {
      hawk.t += 0.006 * dt;
      hawk.x = W * 0.5 + Math.sin(hawk.t) * W * 0.42;
      hawk.y = H * 0.42 + Math.sin(hawk.t * 2) * H * 0.2;
      hawk.active = true;
    } else if (hawk.auto && hawk.idle > 30) hawk.active = false;

    // a slowly wandering roost point keeps the flock one body instead of a dozen splinter groups
    clock += dt;
    const rx = W * (0.5 + 0.28 * Math.sin(clock * 0.0021)), ry = H * (0.42 + 0.14 * Math.sin(clock * 0.0033 + 1));
    const pull = params.coh / 100 * 0.00016;

    buildHash();
    for (let i = 0; i < n; i++) {
      let ax = 0, ay = 0, cx = 0, cy = 0, avx = 0, avy = 0, sx = 0, sy = 0, cnt = 0;
      const gx = Math.min(cols - 1, Math.max(0, ((px[i] / CELL) | 0) + 1));
      const gy = Math.min(rows - 1, Math.max(0, ((py[i] / CELL) | 0) + 1));
      let seen = 0;
      for (let oy = -1; oy <= 1; oy++) {
        const yy = gy + oy; if (yy < 0 || yy >= rows) continue;
        for (let ox = -1; ox <= 1; ox++) {
          const xx = gx + ox; if (xx < 0 || xx >= cols) continue;
          for (let j = head[yy * cols + xx]; j !== -1 && seen < 14; j = next[j]) {
            if (j === i) continue;
            const dx = px[j] - px[i], dy = py[j] - py[i];
            const d2 = dx * dx + dy * dy;
            if (d2 > R2) continue;
            // starlings track ~7 neighbours, not the whole crowd
            seen++; cnt++;
            cx += px[j]; cy += py[j]; avx += vx[j]; avy += vy[j];
            if (d2 < SEP2 && d2 > 0.01) { const k = 1 / d2; sx -= dx * k; sy -= dy * k; }
          }
        }
      }
      if (cnt) {
        ax += (cx / cnt - px[i]) * coh; ay += (cy / cnt - py[i]) * coh;
        ax += (avx / cnt - vx[i]) * ali; ay += (avy / cnt - vy[i]) * ali;
        ax += sx * sep * 6; ay += sy * sep * 6;
      }
      ax += (rx - px[i]) * pull; ay += (ry - py[i]) * pull * 1.4;
      // soft walls: turn back before leaving the sky, stay above the reeds
      const m = 80;
      if (px[i] < m) ax += (m - px[i]) * 0.0016;
      if (px[i] > W - m) ax -= (px[i] - (W - m)) * 0.0016;
      if (py[i] < m) ay += (m - py[i]) * 0.0016;
      if (py[i] > H * 0.8) ay -= (py[i] - H * 0.8) * 0.0024;
      // flee the hawk
      if (hawk.active && fear > 0) {
        const dx = px[i] - hawk.x, dy = py[i] - hawk.y, d2 = dx * dx + dy * dy;
        const FR = 150 * (0.5 + fear);
        if (d2 < FR * FR) {
          const d = Math.sqrt(d2) + 0.001, k = (1 - d / FR) * 0.9 * fear;
          ax += dx / d * k; ay += dy / d * k;
        }
      }
      vx[i] += ax * dt; vy[i] += ay * dt;
      const sp = Math.hypot(vx[i], vy[i]) || 1;
      const cl = Math.min(MAXV, Math.max(MINV, sp));
      vx[i] = vx[i] / sp * cl; vy[i] = vy[i] / sp * cl;
    }
    for (let i = 0; i < n; i++) {
      px[i] += vx[i] * dt * depth[i]; py[i] += vy[i] * dt * depth[i];
      flap[i] += 0.5 * dt;
    }
  }

  function draw() {
    ctx.drawImage(sky, 0, 0, W, H);
    ctx.fillStyle = "#14102a";
    for (let i = 0; i < n; i++) {
      const s = depth[i];
      const sp = Math.hypot(vx[i], vy[i]) || 1;
      const ux = vx[i] / sp, uy = vy[i] / sp;
      const wing = (1.6 + Math.sin(flap[i]) * 0.9) * s * 1.6;
      const len = 2.6 * s;
      const x = px[i], y = py[i];
      ctx.globalAlpha = 0.45 + s * 0.5;
      ctx.beginPath();
      ctx.moveTo(x + ux * len, y + uy * len);
      ctx.lineTo(x - uy * wing - ux * len * 0.3, y + ux * wing - uy * len * 0.3);
      ctx.lineTo(x - ux * len * 0.6, y - uy * len * 0.6);
      ctx.lineTo(x + uy * wing - ux * len * 0.3, y - ux * wing - uy * len * 0.3);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // the hawk itself
    if (hawk.active) {
      hawk.vx += ((hawk.x - (hawk.px ?? hawk.x)) - hawk.vx) * 0.2;
      hawk.vy += ((hawk.y - (hawk.py ?? hawk.y)) - hawk.vy) * 0.2;
      hawk.px = hawk.x; hawk.py = hawk.y;
      const a = Math.atan2(hawk.vy, hawk.vx || 0.001);
      ctx.save(); ctx.translate(hawk.x, hawk.y); ctx.rotate(a);
      ctx.fillStyle = "#0c0a1a";
      ctx.beginPath();
      ctx.moveTo(12, 0); ctx.lineTo(-2, -16); ctx.lineTo(-4, -3); ctx.lineTo(-12, -4); ctx.lineTo(-10, 0);
      ctx.lineTo(-12, 4); ctx.lineTo(-4, 3); ctx.lineTo(-2, 16); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.drawImage(ridge, 0, 0, W, H);
  }

  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let lastT = performance.now();
  function frame(t) {
    const dt = Math.min(2.5, (t - lastT) / 16.67); lastT = t;
    update(still ? dt * 0.4 : dt);
    draw();
    requestAnimationFrame(frame);
  }
  // let the flock settle into shape before the first frame is shown
  for (let k = 0; k < 90; k++) update(1);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
