<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* Layout: torchlit map fills the middle; character sheet strip on top; message log and action buttons at the bottom. */
  :root {
    --dark: #0c0a09;
    --stone: #1a1614;
    --ink: #eadfcf;
    --muted: #8f8273;
    --torch: #ffb35c;
    --blood: #e0533d;
    --edge: #2e2621;
    --display: "Pirata One", "Luminari", fantasy, serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--dark); color: var(--ink); font: 13px/1.45 var(--mono);
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; padding: 10px 16px;
    border-bottom: 1px solid var(--edge);
  }
  header h1 { font: 400 28px/1 var(--display); margin: 0; color: var(--torch); letter-spacing: 0.02em; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-variant-numeric: tabular-nums; color: var(--muted); }
  .stats b { color: var(--ink); font-weight: 700; }
  .hp { display: inline-flex; align-items: center; gap: 8px; }
  .bar { width: 90px; height: 8px; background: var(--stone); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blood); transition: width 0.2s; }
  header a { margin-left: auto; color: var(--muted); text-decoration: none; }
  header a:hover { color: var(--ink); }
  #stage { position: relative; min-height: 0; display: grid; place-items: center; }
  canvas { display: block; max-width: 100%; max-height: 100%; touch-action: none; cursor: pointer; }
  .bottom { border-top: 1px solid var(--edge); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
  #log { min-height: 4.4em; display: grid; align-content: end; gap: 1px; }
  #log div { opacity: 0.5; }
  #log div:last-child, #log div:nth-last-child(2) { opacity: 1; }
  #log .bad { color: var(--blood); } #log .good { color: #9fd67a; } #log .gold { color: var(--torch); }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .acts button {
    font: inherit; color: var(--ink); background: var(--stone); border: 1px solid var(--edge); border-radius: 6px;
    padding: 7px 12px; cursor: pointer;
  }
  .acts button:disabled { opacity: 0.35; cursor: default; }
  .acts button:not(:disabled):hover { border-color: var(--muted); }
  .acts kbd { color: var(--muted); font: inherit; }
  :focus-visible { outline: 2px solid var(--torch); outline-offset: 2px; }
  .over {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: #0c0a09d9; text-align: center;
  }
  .over > div { display: grid; gap: 12px; max-width: 46ch; }
  .over h2 { font: 400 48px/1 var(--display); margin: 0; color: var(--torch); }
  .over p { margin: 0; color: var(--muted); }
  .over .epi { color: var(--ink); font-style: italic; }
  .over button { justify-self: center; font: 400 22px var(--display); color: var(--dark); background: var(--torch); border: 0; border-radius: 6px; padding: 8px 22px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Delve</h1>
  <div class="stats">
    <span class="hp">HP <b id="hp">20/20</b><span class="bar"><i id="hpbar" style="width:100%"></i></span></span>
    <span>depth <b id="depth">1</b>/8</span>
    <span>lvl <b id="lvl">1</b></span>
    <span>atk <b id="atk">3</b></span>
    <span>def <b id="def">0</b></span>
    <span>gold <b id="gold">0</b></span>
  </div>
  <a href="index.html">&larr; playpen</a>
</header>
<div id="stage">
  <canvas id="c" aria-label="Dungeon map. Use arrow keys or tap a direction to move. Walk into monsters to attack."></canvas>
  <div class="over" id="over" hidden><div>
    <h2 id="ov-title">Slain</h2>
    <p class="epi" id="ov-epi"></p>
    <p id="ov-score"></p>
    <button type="button" id="again">Delve again</button>
  </div></div>
</div>
<div class="bottom">
  <div id="log" aria-live="polite"></div>
  <div class="acts">
    <button type="button" id="b-potion">potion <kbd>q</kbd> <span id="np">0</span></button>
    <button type="button" id="b-scroll">scroll <kbd>r</kbd> <span id="ns">0</span></button>
    <button type="button" id="b-wait">wait <kbd>.</kbd></button>
    <button type="button" id="b-rest">rest <kbd>z</kbd></button>
    <button type="button" id="b-down">descend <kbd>&gt;</kbd></button>
  </div>
</div>
<script>
(() => {
  const MW = 48, MH = 28, TORCH = 8, FINAL = 8;
  const WALL = 0, FLOOR = 1, STAIRS = 2;
  const rnd = n => Math.random() * n | 0;
  const pick = a => a[rnd(a.length)];
  const $ = id => document.getElementById(id);

  const MONSTERS = {
    rat:      { ch: "r", name: "rat",      hp: 3,  atk: 2, def: 0, xp: 1,  col: "#b89a7a", d: 1 },
    bat:      { ch: "b", name: "bat",      hp: 3,  atk: 2, def: 0, xp: 2,  col: "#a08cc0", d: 1, erratic: true },
    kobold:   { ch: "k", name: "kobold",   hp: 6,  atk: 3, def: 0, xp: 3,  col: "#c9a23c", d: 2 },
    goblin:   { ch: "g", name: "goblin",   hp: 8,  atk: 4, def: 0, xp: 4,  col: "#6fbf4a", d: 3 },
    skeleton: { ch: "s", name: "skeleton", hp: 11, atk: 5, def: 1, xp: 6,  col: "#e6e1d4", d: 4 },
    orc:      { ch: "o", name: "orc",      hp: 15, atk: 6, def: 1, xp: 8,  col: "#5e9e3a", d: 5 },
    troll:    { ch: "T", name: "troll",    hp: 24, atk: 7, def: 2, xp: 12, col: "#4f8f6f", d: 6, regen: true },
    wraith:   { ch: "W", name: "wraith",   hp: 16, atk: 8, def: 1, xp: 14, col: "#8fb6e8", d: 7, fast: true },
    dragon:   { ch: "D", name: "the dragon", hp: 70, atk: 10, def: 3, xp: 50, col: "#ff5a36", d: 99 },
  };
  const WEAPONS = [["dagger", 1], ["short sword", 2], ["mace", 3], ["longsword", 4], ["war axe", 5], ["runeblade", 7]];
  const ARMORS = [["leather armour", 1], ["chain mail", 2], ["scale mail", 3], ["plate armour", 4]];
  const SCROLLS = ["teleport", "mapping", "fire"];

  let map, seen, vis, mons, items, P, depth, turn, over, killedBy, kills;

  // ----- generation -----
  function generate() {
    map = new Uint8Array(MW * MH); seen = new Uint8Array(MW * MH); vis = new Uint8Array(MW * MH);
    mons = []; items = [];
    const rooms = [];
    for (let tries = 0; tries < 200 && rooms.length < 11; tries++) {
      const w = 4 + rnd(8), h = 3 + rnd(5), x = 1 + rnd(MW - w - 2), y = 1 + rnd(MH - h - 2);
      if (rooms.some(r => x < r.x + r.w + 1 && x + w + 1 > r.x && y < r.y + r.h + 1 && y + h + 1 > r.y)) continue;
      rooms.push({ x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) });
    }
    rooms.sort((a, b) => a.cx - b.cx);
    for (const r of rooms) for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) map[y * MW + x] = FLOOR;
    const carve = (a, b) => {
      let { cx: x, cy: y } = a;
      const horizFirst = Math.random() < 0.5;
      const hx = () => { while (x !== b.cx) { map[y * MW + x] = FLOOR; x += Math.sign(b.cx - x); } };
      const vy = () => { while (y !== b.cy) { map[y * MW + x] = FLOOR; y += Math.sign(b.cy - y); } };
      if (horizFirst) { hx(); vy(); } else { vy(); hx(); }
      map[y * MW + x] = FLOOR;
    };
    for (let i = 1; i < rooms.length; i++) carve(rooms[i - 1], rooms[i]);
    for (let k = 0; k < 3; k++) carve(pick(rooms), pick(rooms)); // a few loops

    const start = rooms[0];
    P.x = start.cx; P.y = start.cy;
    // furthest room by walking distance gets the stairs (or the dragon)
    const dist = bfs(P.x, P.y, true);
    let far = rooms[rooms.length - 1], fd = -1;
    for (const r of rooms) { const d = dist[r.cy * MW + r.cx]; if (d > fd && d < 1e9) { fd = d; far = r; } }

    const free = (x, y) => map[y * MW + x] === FLOOR && !(x === P.x && y === P.y) && !mons.some(m => m.x === x && m.y === y) && !items.some(i => i.x === x && i.y === y);
    const spot = (room) => {
      for (let k = 0; k < 50; k++) {
        const r = room || pick(rooms.slice(1));
        const x = r.x + rnd(r.w), y = r.y + rnd(r.h);
        if (free(x, y)) return [x, y];
      }
      return null;
    };

    if (depth < FINAL) map[far.cy * MW + far.cx] = STAIRS;
    else {
      const t = MONSTERS.dragon;
      mons.push({ ...t, type: "dragon", x: far.cx, y: far.cy, max: t.hp, awake: false });
      items.push({ x: far.cx + (far.w > 2 ? 1 : 0), y: far.cy, k: "heart" });
    }

    const pool = Object.entries(MONSTERS).filter(([, m]) => m.d <= depth && m.d > depth - 4);
    const nMon = 4 + Math.round(depth * 1.6);
    for (let i = 0; i < nMon; i++) {
      const s = spot(); if (!s) continue;
      const [key, t] = pick(pool);
      mons.push({ ...t, type: key, x: s[0], y: s[1], max: t.hp, awake: false });
    }
    const put = (k, extra = {}) => { const s = spot(); if (s) items.push({ x: s[0], y: s[1], k, ...extra }); };
    for (let i = 0; i < 4 + rnd(3); i++) put("gold", { n: 5 + rnd(10 * depth) });
    for (let i = 0; i < 1 + rnd(2); i++) put("potion");
    if (Math.random() < 0.8) put("scroll");
    if (Math.random() < 0.55) { const w = WEAPONS[Math.min(WEAPONS.length - 1, Math.max(0, depth - 1 + rnd(2) - 1))]; put("weapon", { name: w[0], v: w[1] }); }
    if (Math.random() < 0.45) { const a = ARMORS[Math.min(ARMORS.length - 1, Math.max(0, (depth >> 1) - 1 + rnd(2)))]; put("armor", { name: a[0], v: a[1] }); }
    fov();
  }

  // walking distance from (sx,sy); monsters ignore each other here and sort it out when moving
  function bfs(sx, sy) {
    const d = new Float64Array(MW * MH).fill(1e9), q = [sy * MW + sx];
    d[q[0]] = 0;
    for (let h = 0; h < q.length; h++) {
      const i = q[h], x = i % MW, y = (i / MW) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
        const j = ny * MW + nx;
        if (map[j] === WALL || d[j] <= d[i] + 1) continue;
        d[j] = d[i] + 1; q.push(j);
      }
    }
    return d;
  }

  function fov() {
    vis.fill(0);
    for (let y = P.y - TORCH; y <= P.y + TORCH; y++) for (let x = P.x - TORCH; x <= P.x + TORCH; x++) {
      if (x < 0 || y < 0 || x >= MW || y >= MH) continue;
      if ((x - P.x) ** 2 + (y - P.y) ** 2 > TORCH * TORCH) continue;
      // walk the line and stop at the first wall
      const n = Math.max(Math.abs(x - P.x), Math.abs(y - P.y));
      let ok = true;
      for (let s = 1; s < n; s++) {
        const lx = Math.round(P.x + (x - P.x) * s / n), ly = Math.round(P.y + (y - P.y) * s / n);
        if (map[ly * MW + lx] === WALL) { ok = false; break; }
      }
      if (ok) { vis[y * MW + x] = 1; seen[y * MW + x] = 1; }
    }
  }

  // ----- log -----
  function say(msg, cls = "") {
    const d = document.createElement("div"); d.textContent = msg; if (cls) d.className = cls;
    const log = $("log"); log.appendChild(d);
    while (log.children.length > 4) log.firstChild.remove();
  }

  // ----- combat -----
  const roll = a => Math.max(0, Math.round(a / 2 + Math.random() * a));
  function hitMonster(m, dmgOverride) {
    const dmg = dmgOverride ?? Math.max(1, roll(P.atk) - m.def);
    m.hp -= dmg; m.awake = true;
    if (m.hp <= 0) {
      mons = mons.filter(o => o !== m); kills++;
      say(`You slay the ${m.name.replace("the ", "")}.`, "good");
      gainXp(m.xp);
    } else if (dmgOverride == null) say(`You hit the ${m.name.replace("the ", "")} for ${dmg}.`);
  }
  function hitPlayer(m) {
    const dmg = Math.max(0, roll(m.atk) - P.def);
    if (dmg === 0) { say(`The ${m.name.replace("the ", "")} misses.`); return; }
    P.hp -= dmg; flash = 1;
    say(`The ${m.name.replace("the ", "")} hits you for ${dmg}.`, "bad");
    if (P.hp <= 0 && !over) { killedBy = m.name.startsWith("the ") ? m.name : (/^[aeiou]/.test(m.name) ? "an " : "a ") + m.name; die(); }
  }
  function gainXp(n) {
    P.xp += n;
    while (P.xp >= P.lvl * 10) {
      P.xp -= P.lvl * 10; P.lvl++; P.max += 5; P.base++; P.hp = Math.min(P.max, P.hp + 8); recalc();
      say(`You feel stronger. Welcome to level ${P.lvl}.`, "good");
    }
  }
  function recalc() { P.atk = P.base + P.weapon; P.def = P.armor; }

  // ----- turns -----
  function act(dx, dy) {
    if (over) return;
    if (dx || dy) {
      const nx = P.x + dx, ny = P.y + dy;
      const m = mons.find(o => o.x === nx && o.y === ny);
      if (m) hitMonster(m);
      else if (map[ny * MW + nx] === WALL) return; // bumping walls is free
      else { P.x = nx; P.y = ny; pickup(); if (map[ny * MW + nx] === STAIRS) say("Stairs lead down into the dark. Press > to descend."); }
    }
    endTurn();
  }
  function endTurn() {
    turn++;
    if (turn % 7 === 0 && P.hp < P.max) P.hp++;
    fov();
    monstersAct();
    fov(); draw(); hud();
  }
  function monstersAct() {
    const dist = bfs(P.x, P.y);
    for (const m of [...mons]) {
      if (over) return;
      if (m.regen && m.hp < m.max && turn % 2 === 0) m.hp++;
      if (!m.awake) { if (vis[m.y * MW + m.x] && Math.random() < 0.85) m.awake = true; else continue; }
      const moves = m.fast ? 2 : 1;
      for (let k = 0; k < moves && mons.includes(m); k++) {
        if (Math.max(Math.abs(m.x - P.x), Math.abs(m.y - P.y)) === 1) { hitPlayer(m); break; }
        let best = null, bd = dist[m.y * MW + m.x];
        if (bd > 18) continue; // lost the scent
        const opts = [];
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const nx = m.x + dx, ny = m.y + dy, j = ny * MW + nx;
          if (map[j] === WALL || mons.some(o => o.x === nx && o.y === ny)) continue;
          opts.push([nx, ny]);
          if (dist[j] < bd) { bd = dist[j]; best = [nx, ny]; }
        }
        if (m.erratic && Math.random() < 0.5 && opts.length) best = pick(opts);
        if (best) { m.x = best[0]; m.y = best[1]; }
      }
    }
  }
  function pickup() {
    const it = items.find(i => i.x === P.x && i.y === P.y); if (!it) return;
    items = items.filter(i => i !== it);
    if (it.k === "gold") { P.gold += it.n; say(`You pick up ${it.n} gold.`, "gold"); }
    else if (it.k === "potion") { P.potions++; say("You find a red potion.", "good"); }
    else if (it.k === "scroll") { P.scrolls++; say("You find a scroll covered in unreadable runes.", "good"); }
    else if (it.k === "weapon") {
      if (it.v > P.weapon) { P.weapon = it.v; P.weaponName = it.name; recalc(); say(`You wield the ${it.name}. (+${it.v} atk)`, "good"); }
      else say(`A ${it.name}. Your ${P.weaponName} is better.`);
    } else if (it.k === "armor") {
      if (it.v > P.armor) { P.armor = it.v; P.armorName = it.name; recalc(); say(`You put on the ${it.name}. (+${it.v} def)`, "good"); }
      else say(`Some ${it.name}. Yours is better.`);
    } else if (it.k === "heart") win();
  }
  function quaff() {
    if (over || !P.potions) { if (!over) say("You have no potions."); return; }
    P.potions--; const h = Math.max(10, Math.round(P.max * 0.5)); P.hp = Math.min(P.max, P.hp + h);
    say(`You drink the potion and feel much better. (+${h})`, "good"); endTurn();
  }
  function read() {
    if (over || !P.scrolls) { if (!over) say("You have no scrolls."); return; }
    P.scrolls--;
    const s = pick(SCROLLS);
    if (s === "teleport") {
      for (let k = 0; k < 500; k++) { const x = rnd(MW), y = rnd(MH); if (map[y * MW + x] === FLOOR && !mons.some(m => m.x === x && m.y === y)) { P.x = x; P.y = y; break; } }
      say("The scroll crumbles. The world lurches, and you are somewhere else.", "good");
    } else if (s === "mapping") {
      for (let i = 0; i < map.length; i++) if (map[i] !== WALL || neighborsFloor(i)) seen[i] = 1;
      say("The scroll glows. The whole floor's layout burns into your mind.", "good");
    } else {
      const hit = mons.filter(m => vis[m.y * MW + m.x]);
      say(hit.length ? `Fire bursts from the scroll and engulfs ${hit.length} ${hit.length === 1 ? "foe" : "foes"}!` : "Fire bursts from the scroll and scorches the empty walls.", "gold");
      burst = 1;
      hit.forEach(m => hitMonster(m, 10 + depth * 2));
    }
    endTurn();
  }
  function neighborsFloor(i) {
    const x = i % MW, y = (i / MW) | 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < MW && ny < MH && map[ny * MW + nx] !== WALL) return true; }
    return false;
  }
  function rest() {
    if (over) return;
    const visibleFoe = () => mons.some(m => vis[m.y * MW + m.x]);
    if (visibleFoe()) { say("You can't rest with enemies in sight."); return; }
    let n = 0;
    while (P.hp < P.max && n < 150 && !visibleFoe() && !over) { endTurn(); n++; }
    say(n ? `You rest for ${n} turns.` : "You don't need rest.");
  }
  function descend() {
    if (over) return;
    if (map[P.y * MW + P.x] !== STAIRS) { say("There are no stairs here."); return; }
    depth++;
    generate();
    say(depth === FINAL ? "The air is hot and smells of sulphur. Something enormous is breathing." : `You descend to depth ${depth}.`, depth === FINAL ? "bad" : "");
    draw(); hud();
  }

  // ----- end states -----
  const score = (won) => P.gold + depth * 50 + kills * 5 + (won ? 1000 : 0);
  function finish(won, title, epi) {
    over = true; draw(); hud();
    const s = score(won);
    let best = 0; try { best = +localStorage.getItem("delve-best") || 0; } catch {}
    if (s > best) try { localStorage.setItem("delve-best", s); } catch {}
    $("ov-title").textContent = title; $("ov-epi").textContent = epi;
    $("ov-score").textContent = `Score ${s}` + (s > best ? " (a new best)" : ` (best ${best})`) + ` · ${kills} kills · ${turn} turns`;
    $("over").hidden = false; $("again").focus();
  }
  function die() { finish(false, "Slain", `Here lies a level ${P.lvl} delver, killed by ${killedBy} on depth ${depth} with ${P.gold} gold in their pockets.`); }
  function win() { finish(true, "Victory", `You lift the Dragon's Heart, still warm, and climb back up into daylight with ${P.gold} gold. They will sing about this one.`); }

  // ----- drawing -----
  const canvas = $("c"), ctx = canvas.getContext("2d");
  let cell = 20, cols = MW, rows = MH, camX = 0, camY = 0, flash = 0, burst = 0;
  const dpr = Math.min(2, devicePixelRatio || 1);
  function layout() {
    const r = $("stage").getBoundingClientRect();
    cell = Math.max(16, Math.min(28, Math.floor(Math.min(r.width / MW, r.height / MH))));
    cols = Math.min(MW, Math.floor(r.width / cell)); rows = Math.min(MH, Math.floor(r.height / cell));
    canvas.width = cols * cell * dpr; canvas.height = rows * cell * dpr;
    canvas.style.width = cols * cell + "px"; canvas.style.height = rows * cell + "px";
    draw();
  }
  const ITEM = { gold: ["$", "#ffcf5c"], potion: ["!", "#ff6b6b"], scroll: ["?", "#e9dcb6"], weapon: [")", "#9cc8ff"], armor: ["[", "#9cc8ff"], heart: ["♥", "#ff3b5c"] };
  function draw() {
    if (!map) return;
    camX = Math.max(0, Math.min(MW - cols, P.x - (cols >> 1)));
    camY = Math.max(0, Math.min(MH - rows, P.y - (rows >> 1)));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#0c0a09"; ctx.fillRect(0, 0, cols * cell, rows * cell);
    ctx.font = `${Math.round(cell * 0.78)}px "JetBrains Mono", ui-monospace, monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let sy = 0; sy < rows; sy++) for (let sx = 0; sx < cols; sx++) {
      const x = sx + camX, y = sy + camY, i = y * MW + x;
      if (!seen[i]) continue;
      const v = vis[i];
      const d = Math.hypot(x - P.x, y - P.y);
      const light = v ? Math.max(0.35, 1 - d / (TORCH + 1)) : 0.16;
      const px = sx * cell, py = sy * cell;
      if (map[i] === WALL) {
        ctx.fillStyle = v ? `rgba(${120 * light + 30}, ${92 * light + 24}, ${70 * light + 20}, 1)` : "#211c19";
        ctx.fillRect(px + 0.5, py + 0.5, cell - 1, cell - 1);
      } else {
        if (v) { ctx.fillStyle = `rgba(255, 170, 90, ${0.10 * light})`; ctx.fillRect(px, py, cell, cell); }
        if (map[i] === STAIRS) { ctx.fillStyle = v ? "#ffe0a8" : "#6d6254"; ctx.fillText(">", px + cell / 2, py + cell / 2 + 1); }
        else { ctx.fillStyle = `rgba(234, 223, 207, ${0.25 * light + 0.04})`; ctx.fillText("·", px + cell / 2, py + cell / 2); }
      }
    }
    for (const it of items) {
      const i = it.y * MW + it.x; if (!seen[i]) continue;
      const [ch, col] = ITEM[it.k];
      ctx.fillStyle = vis[i] ? col : "#5a5048";
      ctx.fillText(ch, (it.x - camX) * cell + cell / 2, (it.y - camY) * cell + cell / 2 + 1);
    }
    for (const m of mons) {
      if (!vis[m.y * MW + m.x]) continue;
      const px = (m.x - camX) * cell, py = (m.y - camY) * cell;
      ctx.fillStyle = m.col; ctx.font = `700 ${Math.round(cell * 0.82)}px "JetBrains Mono", ui-monospace, monospace`;
      ctx.fillText(m.ch, px + cell / 2, py + cell / 2 + 1);
      if (m.hp < m.max) { ctx.fillStyle = "#e0533d"; ctx.fillRect(px + 2, py + cell - 3, (cell - 4) * m.hp / m.max, 2); }
    }
    // the player
    ctx.font = `700 ${Math.round(cell * 0.85)}px "JetBrains Mono", ui-monospace, monospace`;
    ctx.fillStyle = "#fff4dc"; ctx.fillText("@", (P.x - camX) * cell + cell / 2, (P.y - camY) * cell + cell / 2 + 1);
    if (flash > 0) { ctx.fillStyle = `rgba(224, 83, 61, ${flash * 0.25})`; ctx.fillRect(0, 0, cols * cell, rows * cell); }
    if (burst > 0) { ctx.fillStyle = `rgba(255, 160, 60, ${burst * 0.3})`; ctx.fillRect(0, 0, cols * cell, rows * cell); }
  }
  function fade() {
    if (flash > 0 || burst > 0) { flash = Math.max(0, flash - 0.08); burst = Math.max(0, burst - 0.05); draw(); }
    requestAnimationFrame(fade);
  }

  function hud() {
    $("hp").textContent = `${Math.max(0, P.hp)}/${P.max}`;
    $("hpbar").style.width = Math.max(0, P.hp / P.max * 100) + "%";
    $("depth").textContent = depth; $("lvl").textContent = P.lvl; $("atk").textContent = P.atk; $("def").textContent = P.def; $("gold").textContent = P.gold;
    $("np").textContent = P.potions; $("ns").textContent = P.scrolls;
    $("b-potion").disabled = !P.potions || over; $("b-scroll").disabled = !P.scrolls || over;
    $("b-down").disabled = over || map[P.y * MW + P.x] !== STAIRS;
  }

  // ----- input -----
  const KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], k: [0, -1], j: [0, 1], h: [-1, 0], l: [1, 0],
    y: [-1, -1], u: [1, -1], b: [-1, 1], n: [1, 1],
    "8": [0, -1], "2": [0, 1], "4": [-1, 0], "6": [1, 0], "7": [-1, -1], "9": [1, -1], "1": [-1, 1], "3": [1, 1],
    Home: [-1, -1], PageUp: [1, -1], End: [-1, 1], PageDown: [1, 1],
  };
  addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("button") && (e.key === "Enter" || e.key === " ")) return;
    if (!$("over").hidden) { if (e.key === "Enter") start(); return; }
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (KEYS[k]) { e.preventDefault(); act(...KEYS[k]); }
    else if (k === "." || k === "5" || k === "Clear") act(0, 0);
    else if (k === "q") quaff();
    else if (k === "r") read();
    else if (k === "z") rest();
    else if (k === ">" || k === "Enter") descend();
  });
  canvas.addEventListener("pointerdown", e => {
    const r = canvas.getBoundingClientRect();
    const tx = Math.floor((e.clientX - r.left) / cell) + camX, ty = Math.floor((e.clientY - r.top) / cell) + camY;
    const dx = tx - P.x, dy = ty - P.y;
    if (!dx && !dy) { if (map[P.y * MW + P.x] === STAIRS) descend(); else act(0, 0); return; }
    // snap the tap to one of eight directions
    const a = Math.round(Math.atan2(dy, dx) / (Math.PI / 4));
    const dirs = { 0: [1, 0], 1: [1, 1], 2: [0, 1], 3: [-1, 1], 4: [-1, 0], "-4": [-1, 0], "-3": [-1, -1], "-2": [0, -1], "-1": [1, -1] };
    act(...dirs[a]);
  });
  $("b-potion").addEventListener("click", quaff);
  $("b-scroll").addEventListener("click", read);
  $("b-wait").addEventListener("click", () => act(0, 0));
  $("b-rest").addEventListener("click", rest);
  $("b-down").addEventListener("click", descend);
  $("again").addEventListener("click", start);
  addEventListener("resize", layout);

  function start() {
    P = { x: 0, y: 0, hp: 20, max: 20, base: 3, weapon: 0, armor: 0, atk: 3, def: 0, lvl: 1, xp: 0, gold: 0, potions: 1, scrolls: 0, weaponName: "fists", armorName: "rags" };
    depth = 1; turn = 0; over = false; kills = 0; $("log").innerHTML = "";
    $("over").hidden = true;
    generate();
    say("You descend into the dark with a torch, one potion, and bad intentions.");
    say("Somewhere eight floors below, a dragon guards its heart.");
    layout(); hud();
  }
  start(); fade();
  window.__delve = { get P() { return P; }, get mons() { return mons; }, get depth() { return depth; }, get map() { return map; }, get turn() { return turn; }, MW, MH, act, descend, quaff, read };
})();
</script>
</body>
</html>
