<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Debris Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Share+Tech+Mono&display=swap">
<style>
  /* Layout: the whole screen is the vector display; score along the top edge; thumb pads on touch screens. */
  :root {
    --void: #020604;
    --phos: #c8ffe8;
    --dim: #5f8f7a;
    --ufo: #ff6ad5;
    --title: "Major Mono Display", "Courier New", monospace;
    --mono: "Share Tech Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--void); color: var(--phos); font: 16px/1.4 var(--mono); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 0; display: flex; justify-content: space-between; gap: 16px; pointer-events: none; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px #c8ffe888; }
  .hud a { pointer-events: auto; color: var(--dim); text-decoration: none; }
  .hud a:hover { color: var(--phos); }
  #score { font-size: 24px; }
  .hud .r { display: flex; gap: 18px; align-items: baseline; }
  .hud button { pointer-events: auto; font: inherit; color: var(--dim); background: none; border: 0; cursor: pointer; padding: 0; }
  .screen { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; pointer-events: none; }
  .screen > div { display: grid; gap: 14px; justify-items: center; }
  .screen h1 { font: 400 clamp(36px, 9vw, 84px)/1 var(--title); margin: 0; letter-spacing: 0.04em; text-shadow: 0 0 18px #c8ffe8aa; }
  .screen p { margin: 0; color: var(--dim); max-width: 46ch; }
  .screen .blink { color: var(--phos); animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .screen .blink { animation: none; } }
  .pads { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; pointer-events: none; }
  .pads > div { display: flex; gap: 10px; }
  .pad { pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid #c8ffe855; background: #c8ffe80d; color: var(--phos); font: 22px var(--mono); display: grid; place-items: center; touch-action: none; }
  .pad.on { background: #c8ffe833; }
  :focus-visible { outline: 2px solid var(--phos); outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="c" aria-label="Asteroid field. Arrow keys to steer and thrust, space to fire."></canvas>
<div class="hud">
  <span id="score">0</span>
  <span class="r"><span id="wave">wave 1</span><button type="button" id="mute">sound on</button><a href="index.html">&larr; playpen</a></span>
</div>
<div class="screen" id="title"><div>
  <h1>debris field</h1>
  <p>The station broke apart. Clear the wreckage before it clears you. Big rocks split into small fast ones. Watch out for the saucers.</p>
  <p>←/→ turn · ↑ thrust · space fire · ↓ or shift hyperspace</p>
  <p class="blink" id="prompt">press space or tap to launch</p>
</div></div>
<div class="pads" id="pads" hidden>
  <div><button class="pad" data-k="left" type="button" aria-label="turn left">◀</button><button class="pad" data-k="right" type="button" aria-label="turn right">▶</button></div>
  <div><button class="pad" data-k="hyper" type="button" aria-label="hyperspace">✦</button><button class="pad" data-k="thrust" type="button" aria-label="thrust">▲</button><button class="pad" data-k="fire" type="button" aria-label="fire">●</button></div>
</div>
<script>
(() => {
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const dpr = Math.min(2, devicePixelRatio || 1);
  let W, H;
  function resize() { W = innerWidth; H = innerHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  addEventListener("resize", resize); resize();
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const wrap = o => { if (o.x < -40) o.x += W + 80; if (o.x > W + 40) o.x -= W + 80; if (o.y < -40) o.y += H + 80; if (o.y > H + 40) o.y -= H + 80; };
  const SIZES = [{ r: 46, pts: 20, speed: 40 }, { r: 24, pts: 50, speed: 75 }, { r: 12, pts: 100, speed: 115 }];

  // ----- sound: tiny synthesized blips, started on first interaction -----
  let ac = null, muted = false;
  try { muted = localStorage.getItem("debris-muted") === "1"; } catch {}
  $("mute").textContent = muted ? "sound off" : "sound on";
  function audio() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {} if (ac && ac.state === "suspended") ac.resume(); }
  function blip(f0, f1, dur, type = "square", vol = 0.06) {
    if (!ac || muted) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
  }
  function boom(size) {
    if (!ac || muted) return;
    const dur = 0.25 + size * 0.25, n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = "lowpass"; f.frequency.value = 400 + (2 - size) * 500; g.gain.value = 0.18 + size * 0.06;
    s.buffer = buf; s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
  }
  $("mute").addEventListener("click", () => { muted = !muted; $("mute").textContent = muted ? "sound off" : "sound on"; try { localStorage.setItem("debris-muted", muted ? "1" : "0"); } catch {} });

  // ----- state -----
  let ship, rocks, bullets, ufoShots, ufo, parts, score, lives, wave, mode = "title", shake = 0, nextLife, ufoTimer, respawnT, best = 0;
  try { best = +localStorage.getItem("debris-best") || 0; } catch {}

  function makeRock(x, y, size, vx, vy) {
    const n = 9 + (Math.random() * 4 | 0), shape = [];
    for (let i = 0; i < n; i++) shape.push(0.72 + Math.random() * 0.38);
    const sp = SIZES[size].speed * (0.6 + Math.random() * 0.8) * (1 + wave * 0.05), a = Math.random() * TAU;
    return { x, y, size, r: SIZES[size].r, vx: vx ?? Math.cos(a) * sp, vy: vy ?? Math.sin(a) * sp, rot: Math.random() * TAU, spin: (Math.random() - 0.5) * 1.2, shape };
  }
  function newShip() { return { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, cool: 0, hyper: 0, inv: 2.5, thrusting: false, dead: false }; }
  function startWave() {
    rocks = [];
    for (let i = 0; i < 3 + wave; i++) {
      let x, y;
      do { x = Math.random() * W; y = Math.random() * H; } while (Math.hypot(x - ship.x, y - ship.y) < Math.min(W, H) * 0.3);
      rocks.push(makeRock(x, y, 0));
    }
    $("wave").textContent = "wave " + wave;
    ufoTimer = 14 + Math.random() * 10;
  }
  function newGame() {
    audio();
    score = 0; lives = 3; wave = 1; nextLife = 10000; bullets = []; ufoShots = []; parts = []; ufo = null; respawnT = 0;
    ship = newShip(); startWave(); mode = "play";
    $("title").hidden = true; $("score").textContent = "0";
  }

  function explode(x, y, n, col = "#c8ffe8", speed = 160) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, v = Math.random() * speed;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.7, col, line: Math.random() < 0.3 });
    }
  }
  function addScore(n) {
    score += n; $("score").textContent = score;
    if (score >= nextLife) { lives++; nextLife += 10000; blip(600, 1200, 0.3, "triangle", 0.08); }
  }
  function hitRock(i, bx, by) {
    const r = rocks[i]; rocks.splice(i, 1);
    addScore(SIZES[r.size].pts); boom(2 - r.size); shake = Math.max(shake, 6 - r.size * 2);
    explode(r.x, r.y, 14 - r.size * 3);
    if (r.size < 2) for (let k = 0; k < 2; k++) {
      const a = Math.atan2(r.y - by, r.x - bx) + (k ? 0.8 : -0.8) + (Math.random() - 0.5) * 0.5, sp = SIZES[r.size + 1].speed * (0.8 + Math.random() * 0.6);
      rocks.push(makeRock(r.x, r.y, r.size + 1, Math.cos(a) * sp + r.vx * 0.3, Math.sin(a) * sp + r.vy * 0.3));
    }
  }
  function killShip() {
    if (ship.dead || ship.inv > 0) return;
    ship.dead = true; lives--; shake = 14; boom(2); explode(ship.x, ship.y, 40, "#c8ffe8", 220);
    respawnT = 2;
    if (lives <= 0) {
      setTimeout(() => {
        mode = "over";
        const isBest = score > best; if (isBest) { best = score; try { localStorage.setItem("debris-best", best); } catch {} }
        $("title").querySelector("h1").textContent = "game over";
        $("title").querySelectorAll("p")[0].textContent = `Score ${score} on wave ${wave}. ${isBest ? "A new best." : `Best ${best}.`}`;
        $("title").querySelectorAll("p")[1].textContent = "←/→ turn · ↑ thrust · space fire · ↓ or shift hyperspace";
        $("prompt").textContent = "press space or tap to fly again";
        $("title").hidden = false;
      }, 1200);
    }
  }

  // ----- input -----
  const keys = {};
  const MAP = { ArrowLeft: "left", a: "left", ArrowRight: "right", d: "right", ArrowUp: "thrust", w: "thrust", " ": "fire", ArrowDown: "hyper", s: "hyper", Shift: "hyper" };
  addEventListener("keydown", e => {
    const k = MAP[e.key.length === 1 ? e.key.toLowerCase() : e.key];
    if (k) { e.preventDefault(); keys[k] = true; }
    if (mode !== "play" && (e.key === " " || e.key === "Enter")) newGame();
  });
  addEventListener("keyup", e => { const k = MAP[e.key.length === 1 ? e.key.toLowerCase() : e.key]; if (k) keys[k] = false; });
  addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
  canvas.addEventListener("pointerdown", () => { if (mode !== "play") newGame(); });
  if (matchMedia("(pointer: coarse)").matches) $("pads").hidden = false;
  document.querySelectorAll(".pad").forEach(p => {
    const k = p.dataset.k;
    const on = e => { e.preventDefault(); if (mode !== "play") { newGame(); return; } keys[k] = true; p.classList.add("on"); p.setPointerCapture?.(e.pointerId); };
    const off = () => { keys[k] = false; p.classList.remove("on"); };
    p.addEventListener("pointerdown", on); p.addEventListener("pointerup", off); p.addEventListener("pointercancel", off); p.addEventListener("lostpointercapture", off);
  });

  // ----- update -----
  function update(dt) {
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    shake *= 0.88;
    if (mode === "title") { for (const r of rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.spin * dt; wrap(r); } return; }
    if (mode !== "play") { for (const r of rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.spin * dt; wrap(r); } return; }

    // ship
    if (ship.dead) {
      respawnT -= dt;
      if (respawnT <= 0 && lives > 0) {
        // wait for a clear spot in the middle
        if (!rocks.some(r => Math.hypot(r.x - W / 2, r.y - H / 2) < r.r + 70)) ship = newShip();
      }
    } else {
      if (keys.left) ship.a -= 4.6 * dt;
      if (keys.right) ship.a += 4.6 * dt;
      ship.thrusting = !!keys.thrust;
      if (ship.thrusting) {
        ship.vx += Math.cos(ship.a) * 340 * dt; ship.vy += Math.sin(ship.a) * 340 * dt;
        if (Math.random() < 0.6) parts.push({ x: ship.x - Math.cos(ship.a) * 12, y: ship.y - Math.sin(ship.a) * 12, vx: -Math.cos(ship.a + (Math.random() - 0.5) * 0.6) * 120 + ship.vx, vy: -Math.sin(ship.a + (Math.random() - 0.5) * 0.6) * 120 + ship.vy, life: 0.25, col: "#ffcf8a" });
      }
      const sp = Math.hypot(ship.vx, ship.vy); if (sp > 420) { ship.vx *= 420 / sp; ship.vy *= 420 / sp; }
      ship.vx *= Math.pow(0.55, dt); ship.vy *= Math.pow(0.55, dt);
      ship.x += ship.vx * dt; ship.y += ship.vy * dt; wrap(ship);
      ship.cool -= dt; ship.hyper -= dt; ship.inv -= dt;
      if (keys.fire && ship.cool <= 0 && bullets.length < 7) {
        ship.cool = 0.16;
        bullets.push({ x: ship.x + Math.cos(ship.a) * 14, y: ship.y + Math.sin(ship.a) * 14, vx: Math.cos(ship.a) * 560 + ship.vx, vy: Math.sin(ship.a) * 560 + ship.vy, life: 0.95 });
        blip(880, 220, 0.09);
      }
      if (keys.hyper && ship.hyper <= 0) {
        ship.hyper = 1.5; explode(ship.x, ship.y, 12, "#9ad8ff", 90);
        ship.x = Math.random() * W; ship.y = Math.random() * H; ship.vx = ship.vy = 0; ship.inv = Math.max(ship.inv, 0.4);
        explode(ship.x, ship.y, 12, "#9ad8ff", 90); blip(200, 1600, 0.25, "sine", 0.08);
      }
    }
    // bullets
    for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; wrap(b); }
    for (const b of ufoShots) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; wrap(b); }
    // rocks
    for (const r of rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.spin * dt; wrap(r); }
    for (const b of bullets) {
      for (let i = rocks.length - 1; i >= 0; i--) if (Math.hypot(b.x - rocks[i].x, b.y - rocks[i].y) < rocks[i].r) { b.life = 0; hitRock(i, b.x, b.y); break; }
      if (b.life > 0 && ufo && Math.hypot(b.x - ufo.x, b.y - ufo.y) < ufo.r) { b.life = 0; addScore(ufo.small ? 1000 : 200); explode(ufo.x, ufo.y, 30, "#ff6ad5", 200); boom(1); shake = 8; ufo = null; }
    }
    bullets = bullets.filter(b => b.life > 0);
    ufoShots = ufoShots.filter(b => b.life > 0);
    if (!ship.dead) {
      for (let i = rocks.length - 1; i >= 0; i--) if (Math.hypot(ship.x - rocks[i].x, ship.y - rocks[i].y) < rocks[i].r + 8) { if (ship.inv <= 0) { hitRock(i, ship.x, ship.y); killShip(); } break; }
      for (const b of ufoShots) if (Math.hypot(b.x - ship.x, b.y - ship.y) < 10) { b.life = 0; killShip(); }
      if (ufo && Math.hypot(ufo.x - ship.x, ufo.y - ship.y) < ufo.r + 8) { explode(ufo.x, ufo.y, 30, "#ff6ad5"); ufo = null; killShip(); }
    }
    // saucer
    ufoTimer -= dt;
    if (!ufo && ufoTimer <= 0 && wave >= 2) {
      const small = wave >= 4 && Math.random() < 0.5, left = Math.random() < 0.5;
      ufo = { small, r: small ? 11 : 20, x: left ? -30 : W + 30, y: H * (0.2 + Math.random() * 0.6), vx: (left ? 1 : -1) * (small ? 150 : 100), vy: 0, fire: 1.2, turn: 1.5 };
      ufoTimer = 18 + Math.random() * 12;
    }
    if (ufo) {
      ufo.x += ufo.vx * dt; ufo.y += ufo.vy * dt; ufo.fire -= dt; ufo.turn -= dt;
      if (ufo.turn <= 0) { ufo.vy = (Math.random() - 0.5) * 140; ufo.turn = 1 + Math.random() * 1.5; }
      if (ufo.y < 20) ufo.vy = Math.abs(ufo.vy); if (ufo.y > H - 20) ufo.vy = -Math.abs(ufo.vy);
      if (ufo.fire <= 0 && !ship.dead) {
        ufo.fire = ufo.small ? 0.9 : 1.4;
        const err = ufo.small ? 0.12 : 0.6, a = Math.atan2(ship.y - ufo.y, ship.x - ufo.x) + (Math.random() - 0.5) * err * 2;
        ufoShots.push({ x: ufo.x, y: ufo.y, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, life: 1.6 });
        blip(500, 300, 0.12, "sawtooth", 0.04);
      }
      if (ufo.x < -60 || ufo.x > W + 60) ufo = null;
    }
    if (!rocks.length && !ufo) { wave++; startWave(); if (!ship.dead) ship.inv = Math.max(ship.inv, 1); }
  }

  // ----- draw -----
  function poly(points, x, y, rot, close = true) {
    ctx.beginPath();
    points.forEach(([px, py], i) => { const c = Math.cos(rot), s = Math.sin(rot); const X = x + px * c - py * s, Y = y + px * s + py * c; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
    if (close) ctx.closePath(); ctx.stroke();
  }
  function draw() {
    // phosphor persistence: fade the last frame rather than clearing it
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "rgba(2, 6, 4, 0.42)"; ctx.fillRect(0, 0, W, H);
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    ctx.translate(sx, sy);
    ctx.lineWidth = 1.6; ctx.lineJoin = "round"; ctx.shadowBlur = 10;
    ctx.strokeStyle = "#c8ffe8"; ctx.shadowColor = "#7dffc4";
    for (const r of rocks) {
      const pts = r.shape.map((m, i) => { const a = i / r.shape.length * TAU; return [Math.cos(a) * r.r * m, Math.sin(a) * r.r * m]; });
      poly(pts, r.x, r.y, r.rot);
    }
    if (ship && !ship.dead && mode === "play" && (ship.inv <= 0 || Math.floor(ship.inv * 8) % 2 === 0)) {
      poly([[16, 0], [-11, -9], [-6, 0], [-11, 9]], ship.x, ship.y, ship.a);
      if (ship.thrusting && Math.random() < 0.8) { ctx.strokeStyle = "#ffcf8a"; ctx.shadowColor = "#ffaa44"; poly([[-7, -4], [-16 - Math.random() * 6, 0], [-7, 4]], ship.x, ship.y, ship.a, false); }
    }
    if (ufo) {
      ctx.strokeStyle = "#ff6ad5"; ctx.shadowColor = "#ff6ad5";
      const s = ufo.r / 20;
      poly([[-20 * s, 0], [20 * s, 0], [12 * s, 7 * s], [-12 * s, 7 * s]], ufo.x, ufo.y, 0);
      poly([[-12 * s, 0], [-7 * s, -7 * s], [7 * s, -7 * s], [12 * s, 0]], ufo.x, ufo.y, 0, false);
      poly([[-5 * s, -7 * s], [-3 * s, -12 * s], [3 * s, -12 * s], [5 * s, -7 * s]], ufo.x, ufo.y, 0, false);
    }
    ctx.shadowBlur = 8;
    ctx.fillStyle = "#ffffff"; ctx.shadowColor = "#c8ffe8";
    for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 1.8, 0, TAU); ctx.fill(); }
    ctx.fillStyle = "#ff6ad5"; ctx.shadowColor = "#ff6ad5";
    for (const b of ufoShots) { ctx.beginPath(); ctx.arc(b.x, b.y, 2.2, 0, TAU); ctx.fill(); }
    ctx.shadowBlur = 0;
    for (const p of parts) {
      ctx.globalAlpha = Math.min(1, p.life * 1.5); ctx.strokeStyle = p.col; ctx.fillStyle = p.col;
      if (p.line) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.stroke(); }
      else ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    }
    ctx.globalAlpha = 1;
    // lives as little ships
    if (mode === "play") {
      ctx.strokeStyle = "#c8ffe8"; ctx.lineWidth = 1.3;
      for (let i = 0; i < lives; i++) poly([[0, -9], [6, 7], [0, 4], [-6, 7]], 22 + i * 18, 62, 0);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // title screen: drifting rocks behind the logo
  wave = 1; rocks = Array.from({ length: 7 }, () => makeRock(Math.random() * W, Math.random() * H, Math.random() * 3 | 0));
  parts = []; bullets = []; ufoShots = [];
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__debris = { get state() { return { mode, score, lives, wave, rocks: rocks.length }; }, newGame, keys };
})();
</script>
</body>
</html>
